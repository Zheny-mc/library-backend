version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: library_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - library_net

  # Redis for Celery Broker
  redis:
    image: redis:7-alpine
    container_name: library_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - library_net

  # MinIO (S3 Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: library_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    volumes:
      - minio_data:/data
    networks:
      - library_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Init Job to create bucket automatically
  minio-init:
    image: minio/mc:latest
    container_name: library_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      mc mb myminio/library-books --ignore-existing;
      mc anonymous set download myminio/library-books;
      echo 'Bucket library-books created.';
      exit 0;
      "
    networks:
      - library_net

volumes:
  mongo_data:
  minio_data:

networks:
  library_net:
    driver: bridge
